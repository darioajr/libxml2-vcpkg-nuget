name: Build libxml2 NuGet Package

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest

    # Must match the Environment configured on the nuget.org Trusted Publishing
    # policy -- it is carried as a claim on the OIDC token and the token exchange
    # rejects a mismatch.
    environment: production

    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # The package version lives in the nuspec -- it is the version `nuget pack`
      # stamps onto the .nupkg, and it carries a packaging revision on top of the
      # upstream libxml2 version (e.g. 2.9.10.1 for libxml2 2.9.10). Deriving it
      # from vcpkg.json would tag the release differently from the artifact.
      - name: Obter versão do pacote via nuspec
        id: get-version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = ([xml](Get-Content -Raw -Path "libxml2.nuspec")).package.metadata.version
          if (-not $version) { throw "Could not read <version> from libxml2.nuspec" }

          # A tag push must agree with the nuspec, otherwise the release would
          # advertise a version the .nupkg inside it does not have.
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
            if ($tag -ne $version) {
              throw "Tag '$tag' does not match nuspec version '$version'. Bump libxml2.nuspec or retag."
            }
          }

          Write-Host "Versão: $version"
          "PACKAGE_VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          git -C vcpkg pull
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg.exe integrate install

      - name: Install libxml2 with vcpkg
        run: .\vcpkg\vcpkg.exe install --triplet x64-windows

      # licenses/*.txt is committed (so the repo is auditable and `nuget pack`
      # works locally), but every vcpkg port also installs its authoritative
      # license text at share/<port>/copyright. Overwrite the committed copies
      # with those, so the texts we ship always match the revision we built.
      - name: Collect third-party license texts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $share = "vcpkg_installed\x64-windows\share"
          New-Item -ItemType Directory -Force -Path licenses | Out-Null

          Get-ChildItem -Path $share -Filter copyright -Recurse -File | ForEach-Object {
            $port = $_.Directory.Name
            Copy-Item $_.FullName -Destination "licenses\$port.txt" -Force
            Write-Host "collected: $port"
          }

          # Fail the build if a component we know we redistribute has no license text.
          # A missing text here would mean shipping the binary without its license.
          $required = @("libxml2", "libiconv", "zlib", "liblzma")
          $missing = $required | Where-Object { -not (Test-Path "licenses\$_.txt") }
          if ($missing) {
            throw "Missing license text for redistributed component(s): $($missing -join ', ')"
          }

      - name: Pack NuGet package
        run: |
          nuget pack libxml2.nuspec -OutputDirectory out

      # Trusted Publishing: exchange the job's GitHub OIDC token for a NuGet.org
      # API key that is valid for 1 hour. Keep this step immediately before the
      # push -- the key expires, and each OIDC token buys exactly one key.
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish on NuGet.org
        run: >
          dotnet nuget push out\*.nupkg
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.get-version.outputs.PACKAGE_VERSION }}
          tag_name: ${{ steps.get-version.outputs.PACKAGE_VERSION }}
          files: |
            out/*.nupkg
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
  
      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: libxml2-nupkg
          path: out\*.nupkg